name: CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "code/backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew bootJar

      - name: Prepare JAR
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "No executable JAR found"
            exit 1
          fi

          cp "$JAR" build/libs/app.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: code/backend/build/libs/app.jar
          if-no-files-found: error

  cd:
    name: Deploy
    needs: ci
    runs-on: self-hosted

    defaults:
      run:
        working-directory: code/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: code/backend/build/libs

      - name: Deploy
        env:
          PORT: ${{ secrets.PORT }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: docker compose up -d --build
