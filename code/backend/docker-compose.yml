services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobistock-backend
    restart: unless-stopped

    environment:
      PORT: ${PORT:-8080}
      DB_URL: ${DB_URL:-jdbc:postgresql://host.docker.internal:5432/mobistock}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-your_password}

    ports:
      - "${PORT:-8080}:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"
