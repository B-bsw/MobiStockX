spring.application.name=mobistock-backend
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.docker.compose.enabled=false

# JWT (ต้องตั้ง JWT_SECRET ใน production ความยาวอย่างน้อย 32 ตัวอักษร)
app.jwt.secret=${JWT_SECRET:mobistockx-local-dev-secret-key-change-me-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# OpenAPI / Swagger UI
# http://localhost:${server.port}/swagger-ui/index.html
# http://localhost:${server.port}/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
