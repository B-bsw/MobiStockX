spring.application.name=mobistock-backend
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Batch fetching: ยุบ lazy-load หลาย query ให้เหลือ query เดียวต่อ association
spring.jpa.properties.hibernate.default_batch_fetch_size=64
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048

# Connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# HTTP response compression (payload ของ list API ใหญ่พอที่ gzip จะคุ้ม)
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

spring.docker.compose.enabled=false

# JWT (ต้องตั้ง JWT_SECRET ใน production ความยาวอย่างน้อย 32 ตัวอักษร)
app.jwt.secret=${JWT_SECRET:mobistockx-local-dev-secret-key-change-me-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# OpenAPI / Swagger UI
# http://localhost:${server.port}/swagger-ui/index.html
# http://localhost:${server.port}/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
